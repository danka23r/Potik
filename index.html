<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Потік Order Flow</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: workspace of up to four chart windows under one thin app bar; each window = header strip + canvas
   (chart · profile · price axis · optional DOM). Deliberately dark-only, magenta/lavender. */
:root{
  --bg:#000000; --bar:#08060b; --line:#1d1626; --text:#ece6f2; --muted:#8b7f98; --dim:#3e3448;
  --mag:#e23cf0; --pink:#f7dcf3; --lav:#c4b2ee; --box:#7b23b4; --cvd:#c4b2ee;
  --f-ui:"Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-num:"Geist Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--f-ui);font-size:12px;overflow:hidden;-webkit-font-smoothing:antialiased}
.app{height:100%;display:flex;flex-direction:column}
button,select,input{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
:focus-visible{outline:1px solid var(--mag);outline-offset:1px}

.tb{display:flex;align-items:center;gap:12px;height:36px;flex:none;background:var(--bar);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow-x:auto;scrollbar-width:none;white-space:nowrap}
.tb::-webkit-scrollbar{display:none}
.brand{font-weight:700;letter-spacing:.16em;font-size:11px;color:var(--lav)}
.sep{width:1px;height:16px;background:var(--line);flex:none}
.lay{display:flex;gap:2px;flex:none}
.lay button{width:30px;height:24px;display:grid;place-items:center;border-radius:4px;color:var(--muted)}
.lay button:hover{color:var(--text);background:#140f19}
.lay button[aria-pressed="true"]{color:#fff;background:#1c1424}
.lay svg{width:18px;height:14px}
.addw{padding:3px 9px;border:1px solid var(--line);border-radius:4px;color:var(--muted)}
.addw:hover{color:var(--text)}
.addw:disabled{opacity:.35;cursor:default}
.wtabs{display:none;gap:2px}
.wtabs button{padding:3px 9px;border-radius:4px;color:var(--muted)}
.wtabs button[aria-pressed="true"]{background:#1c1424;color:#fff}
.right{margin-left:auto;display:flex;align-items:center;gap:10px;flex:none}
.sim{font-size:10px;letter-spacing:.08em;color:var(--mag);border:1px solid #4a1f52;border-radius:3px;padding:1px 5px}
.clk{font-family:var(--f-num);color:var(--muted);font-variant-numeric:tabular-nums}
.right select{background:var(--bar);border:1px solid var(--line);border-radius:4px;padding:2px 4px;font-family:var(--f-num);font-size:11px}
.pp{padding:3px 8px;border:1px solid var(--line);border-radius:4px;color:var(--muted);min-width:52px}
.pp:hover{color:var(--text)}

.ws{position:relative;flex:1;min-height:0;display:grid;gap:4px;padding:4px;background:#0b0810;
  padding-left:max(4px,env(safe-area-inset-left,0px));padding-right:max(4px,env(safe-area-inset-right,0px))}
.ws.max .win{display:none}
.ws.max .win.maxed{display:flex;grid-area:1/1/-1/-1!important;position:relative!important;left:auto!important;top:auto!important;width:auto!important;height:auto!important}
.split{position:absolute;z-index:12;border-radius:3px}
.split.col{cursor:col-resize}.split.row{cursor:row-resize}
.split:hover,.split:active{background:rgba(196,178,238,.35)}
.win.float{position:absolute;z-index:15;box-shadow:0 14px 40px rgba(0,0,0,.65);border-color:#4a2a58}
.win.float .wh{cursor:move}
.frz{display:none;position:absolute;right:0;bottom:0;width:14px;height:14px;z-index:8;cursor:nwse-resize;background:linear-gradient(135deg,transparent 50%,#5a2f68 50%)}
.win.float .frz{display:block}

.win{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg);border:1px solid var(--line);border-radius:4px;overflow:hidden}
.win.act{border-color:#4a2a58}
.wh{display:flex;align-items:center;gap:6px;height:30px;flex:none;padding:0 6px 0 8px;background:var(--bar);border-bottom:1px solid var(--line);white-space:nowrap;overflow:visible;position:relative}
.wsym{font-family:var(--f-num);font-weight:600;font-size:11.5px;margin-right:2px}
.wh select{background:#120d17;border:1px solid var(--line);border-radius:4px;padding:2px 4px;font-family:var(--f-num);font-size:11px;color:var(--text)}
.seg{display:flex;gap:1px;flex:none}
.seg button{padding:3px 7px;border-radius:4px;color:var(--muted);font-size:11.5px}
.seg button:hover{color:var(--text)}
.seg button[aria-pressed="true"]{color:#fff;background:#1c1424}
.stb,.tgl{padding:3px 7px;border-radius:4px;color:var(--muted);font-size:11.5px}
.stb:hover,.tgl:hover{color:var(--text)}
.tgl[aria-pressed="true"]{color:#fff}
.win.tpo .tgl,.win.tpo .indb{display:none}
.win:not(.tpo) .tpoRow{display:none}
.win.vdom .btSel,.win.vdom .indb,.win.vdom .tgl,.win.vtape .btSel,.win.vtape .indb,.win.vtape .tgl,.win.vacct .btSel,.win.vacct .indb,.win.vacct .tgl{display:none}
.tbar{position:absolute;bottom:0;z-index:4;display:flex;flex-direction:column;gap:4px;padding:6px;background:#0b0810;border-top:1px solid var(--line);border-left:1px solid var(--line)}
.tbar[hidden]{display:none}
.tbr{display:flex;gap:4px;min-width:0}
.tbr button{flex:1;min-width:0;padding:4px 2px;border:1px solid #3a3042;border-radius:4px;color:#ddd4e6;font-size:11px;white-space:nowrap;overflow:hidden}
.tbr button:hover{background:#21192a;color:#fff}
.tbr button[data-a="minus"],.tbr button[data-a="plus"]{flex:0 0 24px}
.tbr .tbuy{background:#123a33;border-color:#1f6b5c;color:#bff5e6}
.tbr .tsell{background:#3b1426;border-color:#7a2a4c;color:#ffd0e2}
.tbr input{width:44px;flex:none;background:#0d0a10;border:1px solid #3a3042;border-radius:4px;padding:2px 4px;font-family:var(--f-num);font-size:12px;text-align:center;color:var(--text)}
.tbr select{flex:1;min-width:0;background:#0d0a10;border:1px solid #3a3042;border-radius:4px;padding:2px 4px;font-size:11px;color:var(--text)}
.tpos{font-family:var(--f-num);font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tpos.up,.atbl .up,.accard .up,.acpos .up{color:#5fe0bd}.tpos.dn,.atbl .dn,.accard .dn,.acpos .dn{color:#ff8a9a}
.acct{position:absolute;inset:0;z-index:3;display:none;overflow:auto;background:var(--bg);padding:0 14px 16px}
.win.vacct .acct{display:block}
.actabs{position:sticky;top:0;z-index:1;display:flex;flex-wrap:wrap;gap:2px;padding:8px 0;background:var(--bg);border-bottom:1px solid #251e2c}
.actabs button{padding:4px 10px;border-radius:5px;color:var(--muted);font-size:12px}
.actabs button:hover{color:var(--text)}
.actabs button[aria-pressed="true"]{background:#2e2238;color:#fff;box-shadow:inset 0 0 0 1px #5a2f68}
.acgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:12px}
.accard{display:flex;flex-direction:column;gap:3px;padding:8px 10px;border:1px solid #251e2c;border-radius:6px;background:#0b0810}
.accard span{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.accard b{font-family:var(--f-num);font-size:13px;font-weight:600;color:var(--text)}
.acsub{margin:16px 0 6px;font-size:10.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.acnote{margin:6px 0;color:var(--muted);font-size:11.5px;line-height:1.45}
canvas.eq{display:block;width:100%;height:150px;border:1px solid #251e2c;border-radius:6px}
.atbl{width:100%;border-collapse:collapse;font-family:var(--f-num);font-size:11.5px;margin:4px 0 8px}
.atbl th{text-align:left;font-weight:500;color:var(--muted);padding:4px 6px;border-bottom:1px solid #251e2c;font-family:var(--f-ui);font-size:10.5px;letter-spacing:.04em;text-transform:uppercase}
.atbl td{padding:4px 6px;border-bottom:1px solid #18131d;color:#ddd4e6;white-space:nowrap}
.acpos{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-family:var(--f-num)}
.alform{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.alform select,.alform input[type=number],.acct .dact input[type=number]{background:#0d0a10;border:1px solid #3a3042;border-radius:5px;padding:4px 6px;font-family:var(--f-num);font-size:12px;color:var(--text)}
.alform input[type=number]{width:110px}
.alrep{display:flex;align-items:center;gap:6px;color:#cfc6d9;font-size:12px}
.atmwrap{overflow-x:auto}
.atbl.atm input{width:46px;background:#0d0a10;border:1px solid #3a3042;border-radius:4px;padding:2px 4px;font-family:var(--f-num);font-size:11.5px;color:var(--text)}
.atbl.atm input[type=text]{width:220px}
.hbtn{padding:3px 9px;border:1px solid var(--line);border-radius:4px;color:var(--muted)}
.hbtn:hover{color:var(--text);border-color:#3a3042}
.hbtn[aria-pressed="true"]{color:#fff;border-color:#5a2f68;background:#2e2238}
.hbtn:disabled{opacity:.4;cursor:default}
.sim.rp{color:#ffd166;border-color:#5c4a1f}.sim.csv{color:#8fd3ff;border-color:#1f4a5c}.sim.ws{color:#5fe0bd;border-color:#1f5c4a}
.rbar{display:flex;align-items:center;gap:6px;flex:none;height:34px;padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));background:#120d16;border-bottom:1px solid #3a2a20;overflow-x:auto;scrollbar-width:none;white-space:nowrap}
.rbar[hidden]{display:none}
.rbar button{padding:3px 8px;border:1px solid #2c2433;border-radius:4px;color:#cfc6d9;font-size:11.5px}
.rbar button:hover{color:#fff;border-color:#4a3a52;background:#1d1622}
.rtag{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:#ffd166;border:1px solid #5c4a1f;border-radius:3px;padding:1px 6px}
.rday{color:var(--text);font-size:12px;margin-right:4px}
#rslider{flex:1 1 160px;min-width:120px;accent-color:#e23cf0}
.rtime{font-family:var(--f-num);font-size:11.5px;color:var(--text);min-width:86px}
.rchk{display:flex;align-items:center;gap:5px;color:var(--muted);font-size:11.5px}
.rchk input[type=number]{width:56px;background:#0d0a10;border:1px solid #3a3042;border-radius:4px;padding:2px 4px;font-family:var(--f-num);font-size:11.5px;color:var(--text)}
.rbar .sp{flex:0 0 4px}
.rbar .rexit{color:#ffd166;border-color:#5c4a1f}
.busy{position:fixed;inset:0;z-index:95;display:grid;place-items:center;background:rgba(0,0,0,.45)}
.busy[hidden]{display:none}
.busy .bx{display:flex;align-items:center;gap:10px;padding:12px 16px;background:#141017;border:1px solid #2c2433;border-radius:10px;color:var(--text);font-size:12.5px}
.spin{width:14px;height:14px;border:2px solid #3a3042;border-top-color:var(--mag);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
.dfs .frow input[type=url],.dfs .frow input[type=text],.dimp .frow input[type=text]{width:min(340px,60vw)}
.dfile{margin:4px 0 8px;color:var(--muted);font-size:12px}
.dprev{overflow-x:auto}
.dhelp{margin-top:14px;color:var(--muted)}
.dhelp summary{cursor:pointer;font-size:12px}
.dhelp pre{white-space:pre-wrap;word-break:break-all;font-family:var(--f-num);font-size:11px;color:#cfc6d9;background:#0b0810;border:1px solid #251e2c;border-radius:6px;padding:8px;margin:8px 0}
.toasts{position:fixed;top:44px;right:12px;z-index:90;display:flex;flex-direction:column;gap:6px;pointer-events:none}
.toast{max-width:340px;padding:8px 12px;border-radius:7px;background:#1a1520;border:1px solid #2c2433;border-left:3px solid var(--lav);color:var(--text);font-size:12px;box-shadow:0 8px 24px rgba(0,0,0,.5);transition:opacity .3s,transform .3s}
.toast.buy{border-left-color:#2ee6a6}.toast.sell{border-left-color:#ff5c7a}.toast.alert{border-left-color:#ffd166}
.toast.out{opacity:0;transform:translateX(12px)}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
.nedit{position:absolute;z-index:5;background:#0d0a10;border:1px solid var(--mag);border-radius:3px;padding:0 5px;font-family:var(--f-num);font-size:11px;color:var(--text);outline:none}
.dcols{display:grid;margin:0 0 16px}
.dcrow{display:grid;grid-template-columns:minmax(0,1fr) 78px 78px 58px;align-items:center;gap:8px;min-height:32px;border-bottom:1px solid #1c1622;color:#cfc6d9;font-size:12px}
.dcrow.dchd{min-height:26px;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.dcrow .sw{justify-self:center}
.dcrow .dchd-c{text-align:center}
.dord{display:flex;gap:2px;justify-content:flex-end}
.dord .ic{font-size:12px}
.dsub{margin:18px 0 6px;font-size:10.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.sp{flex:1}
.ic{width:24px;height:22px;display:grid;place-items:center;border-radius:4px;color:var(--muted)}
.ic:hover{background:#1c1424;color:#fff}
.ic:disabled{opacity:.3;cursor:default;background:none}
.ic svg{width:13px;height:13px}
.body{position:relative;flex:1;min-height:0}
.body canvas{display:block;width:100%;height:100%;touch-action:none}
.body canvas.ov{position:absolute;inset:0;pointer-events:none}
.rerr{position:absolute;left:8px;right:8px;bottom:30px;z-index:6;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:7px 10px;border:1px solid #7a2a4c;border-radius:7px;background:rgba(59,20,38,.95);color:#ffd0e2;font-size:11.5px}
.rerr[hidden]{display:none}
.rerr span{flex:1;min-width:160px}
.live{position:absolute;left:10px;bottom:28px;padding:4px 9px;border-radius:4px;background:#1c1424;border:1px solid var(--line);font-size:11px}

.dt{position:absolute;top:44px;left:50%;display:flex;align-items:center;gap:2px;padding:4px;border-radius:10px;background:#16121b;border:1px solid #2a2232;box-shadow:0 6px 24px rgba(0,0,0,.6);z-index:20;user-select:none;-webkit-user-select:none}
.dt .grip{width:16px;height:30px;display:grid;place-items:center;color:#5c5266;cursor:grab;touch-action:none}
.dt button{width:34px;height:30px;display:grid;place-items:center;border-radius:6px;color:#bdb3c8}
.dt button:hover{background:#231c2b;color:#fff}
.dt button[aria-pressed="true"]{background:#2e2238;color:#fff;box-shadow:inset 0 0 0 1px #5a2f68}
.dt button.warn{color:#ff6b7f;background:#2b1219}
.dt svg{width:20px;height:20px}
.dt .vs{width:1px;height:20px;background:#2a2232;margin:0 3px}
.mrow{flex:1;min-height:0;display:flex}
.mrow>.ws{flex:1;min-width:0}
/* docked drawing toolbar: a vertical bar on the right (or left) edge, like TradingView */
.dt.dock{position:relative;top:auto!important;left:auto!important;flex:none;flex-direction:column;align-items:center;width:46px;padding:6px 0;gap:2px;border-radius:0;border-width:0 0 0 1px;box-shadow:none;background:#120e15;overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
.dt.dock.left{border-width:0 1px 0 0}
.dt.dock .grip{display:none}
.dt.dock .vs{width:24px;height:1px;margin:4px 0}
.dt.dock>button,.dt.dock .tgm{width:36px!important;height:34px!important}
.dt.dock .tgw{flex:none}
.dt.dock .tgw .tgc{position:absolute;right:-3px;bottom:1px;width:10px!important;height:12px!important;border-radius:3px}
.dt.dock .sp{flex:1}
.tfly.fx{position:fixed;top:auto;left:auto}


.stb{display:flex;align-items:center;gap:5px}
.stb svg{width:13px;height:13px}
.cmenu{position:fixed;z-index:60;min-width:250px;padding:6px 0;background:#161219;border:1px solid #2c2433;border-radius:8px;box-shadow:0 14px 40px rgba(0,0,0,.65);font-size:12.5px}
.cmenu[hidden]{display:none}
.mitem{display:flex;align-items:center;gap:10px;width:100%;padding:7px 14px;color:#ddd4e6;text-align:left}
.mitem:hover,.msubw.open>.mitem{background:#241c2c;color:#fff}
.mitem:disabled{opacity:.35;cursor:default;background:none}
.mitem svg,.mitem .noic{width:16px;height:16px;flex:none}
.mitem.on>svg:first-child{color:#0b0710;background:var(--mag);border-radius:3px;padding:1px}
.mitem.danger{color:#ff8a9a}
.mlab{flex:1}
.mitem kbd{font-family:var(--f-ui);font-size:11px;color:var(--muted)}
.chev{width:12px!important;height:12px!important;color:var(--muted)}
.msep{height:1px;background:#2a2232;margin:5px 0}
.msubw{position:relative}
.msub{display:none;position:absolute;left:100%;top:-6px;min-width:210px;padding:6px 0;background:#161219;border:1px solid #2c2433;border-radius:8px;box-shadow:0 14px 40px rgba(0,0,0,.65)}
.msub.left{left:auto;right:100%}
.msubw.open>.msub{display:block}

.dlg{position:fixed;inset:0;z-index:70;display:grid;place-items:center;background:rgba(0,0,0,.55);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.dlg[hidden]{display:none}
.dbox{width:min(720px,100%);max-height:min(640px,90vh);display:flex;flex-direction:column;background:#141017;border:1px solid #2c2433;border-radius:12px;box-shadow:0 24px 60px rgba(0,0,0,.7);overflow:hidden}
.dhd{display:flex;align-items:center;gap:10px;padding:12px 14px 12px 18px;border-bottom:1px solid #251e2c}
.dhd h2{margin:0;flex:1;font-size:14px;font-weight:600;letter-spacing:.01em}
.dbd{padding:14px 18px 18px;overflow:auto;min-height:0}
.dbd.ind{display:grid;grid-template-columns:230px minmax(0,1fr);gap:18px;padding:0}
.dbox.wide{width:min(1000px,100%);height:min(720px,92vh);max-height:none}
.dbd.set{flex:1;grid-template-columns:240px minmax(0,1fr);gap:0}
.snav{background:#100c13;padding:8px 0 14px}
.ssrch{display:block;width:calc(100% - 24px);margin:4px 12px 6px;background:#0b0810;border:1px solid #3a3042;border-radius:6px;padding:6px 9px;color:var(--text);font-size:12px}
.snav .irow{padding:2px 10px 2px 14px;border-left:2px solid transparent}
.snav .irow.sel{background:#21192a;border-left-color:var(--mag)}
.snav .irow.hid .iname{color:var(--dim);text-decoration:line-through}
.snav .iname{padding:6px 0}
.sdot{width:8px;height:8px;margin:0 13px 0 13px;border-radius:2px;flex:none;background:#6e6479}
.iset.spage{padding:16px 22px 22px}
.shead{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:0 0 6px}
.shead h3{flex:1;min-width:140px;margin:0}
.sctl{display:flex;gap:16px;flex-wrap:wrap}
.schk{display:flex;align-items:center;gap:8px;color:#cfc6d9;font-size:12px;cursor:pointer}
.sgrid{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.sgrid .btn2{margin:0}
.embd>.dbd,.embd{padding:0}
@media (max-width:699px){.dbox.wide{height:92vh}.dbd.set{grid-template-columns:1fr;grid-template-rows:auto 1fr}.snav{max-height:34vh}}
.ilist{border-right:1px solid #251e2c;padding:10px 0;overflow:auto}
.igrp{padding:10px 16px 4px;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.irow{display:flex;align-items:center;gap:10px;padding:4px 12px 4px 16px}
.irow.sel{background:#21192a}
.hsel{background:#0d0a10;border:1px solid var(--line);border-radius:4px;padding:3px 6px;color:var(--muted);font-size:12px;max-width:180px}
.wsym{cursor:pointer}.wsym:hover{color:#fff;text-decoration:underline}
.lnk{min-width:22px;height:20px;padding:0 5px;border:1px solid #3a3042;border-radius:4px;color:#6e6479;font-size:11px;font-weight:700;line-height:1}
.lnk:hover{color:#fff}

/* ---------- simulated order book (L2) ----------
   Displayed size at a price = resting base liquidity (bs) + large orders (walls). Base levels drift toward a depth
   profile. Walls are plain, iceberg (a small visible part that refills) or spoof (pulled when price comes close).
   Plain and iceberg walls stop price until enough of them is traded; every trade hits the queue at its price.
   A 96-level snapshot is stored every second of market time for the heatmap and DOM Power. Runs from today's open. */
const BKN=8192, BKL=60;
const BK={on:false,base:0,bs:new Float64Array(BKN),ws:new Float64Array(BKN),chg:new Float64Array(BKN),walls:[],bid:0,step:0,lastSnap:-1e9};
const bkI=px=>px-BK.base;
const bkTgt=d=>5+12*(1-Math.exp(-d/7))+(d%4===0?3:0);   // average resting size d ticks from the touch
function bkSize(px){const i=px-BK.base; return i<0||i>=BKN?0:Math.max(0,Math.round(BK.bs[i]+BK.ws[i]))}
function bkInit(p){
  BK.bid=Math.floor(p); BK.base=BK.bid-BKN/2; BK.bs.fill(0); BK.ws.fill(0); BK.chg.fill(0); BK.walls.length=0;
  for(let d=0;d<BKL;d++){BK.bs[bkI(BK.bid-d)]=Math.round(bkTgt(d)*(.6+.8*rnd())); BK.bs[bkI(BK.bid+1+d)]=Math.round(bkTgt(d)*(.6+.8*rnd()))}
}
function bkShift(){   // keep the price window centred in the arrays
  const k=BK.bid-(BK.base+BKN/2); if(Math.abs(k)<BKN/4) return;
  for(const a of [BK.bs,BK.ws,BK.chg]){if(k>0){a.copyWithin(0,k); a.fill(0,BKN-k)} else {a.copyWithin(-k,0,BKN+k); a.fill(0,0,-k)}}
  BK.base+=k;
}
function bkDropWalls(test){
  let any=false;
  for(const w of BK.walls) if(test(w)){w.dead=true; any=true; const i=bkI(w.px); BK.ws[i]=Math.max(0,BK.ws[i]-w.shown)}

// price moved: the levels it crossed were traded through and now belong to the other side
function bkMoveTo(nb){
  const ob=BK.bid; if(nb===ob) return;
  if(Math.abs(nb-ob)>BKL){bkInit(nb+.5); return}
  if(nb>ob){
    bkDropWalls(w=>w.px>ob&&w.px<=nb);
    for(let px=ob+1;px<=nb;px++){const i=bkI(px); BK.bs[i]=2+Math.floor(rnd()*5); BK.chg[i]=0}
    for(let px=ob+1+BKL;px<=nb+BKL;px++){const i=bkI(px); if(!BK.bs[i]) BK.bs[i]=Math.round(bkTgt(px-nb-1)*(.6+.8*rnd()))}
    for(let px=ob-BKL+1;px<=nb-BKL;px++) BK.bs[bkI(px)]=0;
  }else{
    bkDropWalls(w=>w.px<=ob&&w.px>nb);
    for(let px=nb+1;px<=ob;px++){const i=bkI(px); BK.bs[i]=2+Math.floor(rnd()*5); BK.chg[i]=0}
    for(let px=nb-BKL+1;px<=ob-BKL;px++){const i=bkI(px); if(!BK.bs[i]) BK.bs[i]=Math.round(bkTgt(nb-px)*(.6+.8*rnd()))}
    for(let px=nb+BKL+1;px<=ob+BKL;px++) BK.bs[bkI(px)]=0;
  }

// a trade takes size from the queue at its price: base orders first, then walls (icebergs refill)
function bkExec(px,size){
  const i=bkI(px); let r=size, k=Math.min(BK.bs[i],r); BK.bs[i]-=k; r-=k;

      if(w.px!==px||r<=0) continue;
      k=Math.min(w.shown,r); w.shown-=k; BK.ws[i]-=k; r-=k;
      if(w.shown<=0){if(w.ice&&w.hidden>0){const f=Math.min(w.hidden,w.peak); w.hidden-=f; w.shown=f; BK.ws[i]+=f} else w.dead=dead=true}

// a move that would cross a holding wall stops one tick before it
function bkHold(p0,dp){

function bkClearChg(){const i0=Math.max(0,bkI(BK.bid-BKL-5)), i1=Math.min(BKN,bkI(BK.bid+BKL+6)); BK.chg.fill(0,i0,i1)}

    const w={px,side,spoof,ice,die:sim.t+40+rnd()*500,peak:ice?12+Math.floor(rnd()*14):size};

const HM={L:96,n:0,cap:4096,t:new Float64Array(4096),bid:new Int32Array(4096),sz:new Uint16Array(4096*96),

const TP={cap:1<<16,n:0,lo:0,cnt(){return Math.min(this.n-this.lo,this.cap)},t:new Float64Array(1<<16),px:new Int32Array(1<<16),sz:new Int32Array(1<<16),sd:new Int8Array(1<<16),

  at(k){return (this.n-1-k)&(this.cap-1)}};   // index of the k-th newest trade, k < min(n, cap)

function placeOrder(spec){

  o.qty=Math.max(1,Math.round(o.qty)); BRK.orders.push(o);

  if(o.type==='MKT'){fillOrder(o,o.qty,mkt(o.side),sim.t); return o}

function fillOrder(o,k,px,t){

function reverse(){const q=BRK.q; if(!q) return; flatten(); placeOrder({side:-Math.sign(q),type:'MKT',qty:Math.abs(q),role:'entry',atm:+ACC.atm})}
function mktOrder(side){return placeOrder({side,type:'MKT',qty:ACC.qty,role:'entry',atm:+ACC.atm})}
// a click at a price: limit when the price is on the passive side, stop when it is beyond the market
function priceOrder(side,px){return placeOrder({side,type:side>0?(px<bestAsk()?'LMT':'STP'):(px>bestBid()?'LMT':'STP'),px,qty:ACC.qty,role:'entry',atm:+ACC.atm})}
function modifyOrder(id,px){
  const o=BRK.orders.find(x=>x.id===id); if(!o||o.px===px) return; o.px=px;
  if(o.type==='LMT'){if(o.side>0?px>=bestAsk():px<=bestBid()){fillOrder(o,o.qty-o.filled,o.side>0?bestAsk():bestBid(),sim.t); return} o.queue=bkSize(px)}
  if(o.type==='STP'&&(o.side>0?D.last>=px:D.last<=px)){fillOrder(o,o.qty-o.filled,o.side>0?bestAsk()+ACC.slip:bestBid()-ACC.slip,sim.t); return}
  brkChanged();

// every market trade: excursions of the open position, then fills of working orders
function brkOnTrade(t,side,size,px){
  if(BRK.round&&BRK.q){const e=(px-BRK.avg)*Math.sign(BRK.q); if(e>BRK.round.mfe)BRK.round.mfe=e; if(e<BRK.round.mae)BRK.round.mae=e}
  if(!BRK.orders.length) return;
  for(const o of BRK.orders.slice()){
    if(o.status!=='working') continue; const rem=o.qty-o.filled;
    if(o.type==='LMT'){
      if(o.side>0?px<o.px:px>o.px) fillOrder(o,rem,o.px,t);                                  // traded through
      else if(px===o.px&&side!==o.side){o.queue-=size; if(o.queue<0){fillOrder(o,Math.min(rem,-o.queue),o.px,t); o.queue=0}}
    }else if(o.type==='STP'&&(o.side>0?px>=o.px:px<=o.px)) fillOrder(o,rem,o.side>0?Math.max(px,o.px)+ACC.slip:Math.min(px,o.px)-ACC.slip,t);
  }

}
// alerts: price crossing, big print, tape speed, session P&L, stacked imbalance on a finished 1-minute bar
function alertFire(a,msg){a.fired=sim.t; if(!a.repeat) a.on=false; ALOG.unshift({t:sim.t,msg}); if(ALOG.length>60) ALOG.pop(); toast('Alert · '+msg,'alert'); beep(880,.18); saveAlerts(); brkChanged()}
const ALERT_COOL=10;
function alertTrade(size,side,px){for(const a of ALERTS) if(a.on&&a.kind==='big'&&size>=a.value&&(a.op==='any'||(a.op==='buy')===(side>0))&&sim.t-(a.fired||-1e9)>2) alertFire(a,`${sideTxt(side)} print ${size} @ ${fP(px)}`)}
let alPrev=null, alSec=0, alBars=0;
function alertTick(){
  if(!ALERTS.length){alPrev=D.last; alBars=D.m1.length; return}
  const px=D.last, prev=alPrev??px, cool=a=>sim.t-(a.fired||-1e9)>ALERT_COOL;
  for(const a of ALERTS){
    if(!a.on||!cool(a)) continue;
    if(a.kind==='price'){const v=Math.round(a.value/TICK); if((a.op!=='below'&&prev<v&&px>=v)||(a.op!=='above'&&prev>v&&px<=v)) alertFire(a,`Price ${px>prev?'crossed above':'crossed below'} ${fP(v)}`)}
    else if(a.kind==='line'){const d=DR.find(x=>x.id===a.did); if(!d){a.on=false; continue} const v=linePriceAt(d,sim.t); if(v!=null){const r=Math.round(v); if((prev<r&&px>=r)||(prev>r&&px<=r)) alertFire(a,`Price crossed ${d.name||TNAME[d.type]} at ${fP(r)}`)}}
    else if(a.kind==='pnl'){const p=ACC.balance-BRK.dayBal+(BRK.q?(D.last-BRK.avg)*BRK.q*usdTick():0); if(a.op==='above'?p>=a.value:p<=-Math.abs(a.value)) alertFire(a,`Session P&L ${p>=0?'+':''}$${p.toFixed(0)}`)}
  }
  if(sim.t-alSec>=1){alSec=sim.t; const sp=tapeSpeed(10); for(const a of ALERTS) if(a.on&&a.kind==='speed'&&cool(a)&&sp.n>=a.value) alertFire(a,`Tape speed ${sp.n} trades / 10 s`)}
  if(D.m1.length>alBars){
    const c=D.m1[D.m1.length-2]; alBars=D.m1.length;
    if(c&&ALERTS.some(a=>a.on&&a.kind==='stack')){
      const F=IND_BY.fp.def, A=fpAnalyze(c,F,fpSig(F),D.m1[D.m1.length-1].t0), buy=A.n&&A.stacks.some(s=>s.side>0), sell=A.n&&A.stacks.some(s=>s.side<0);
      for(const a of ALERTS) if(a.on&&a.kind==='stack'&&cool(a)&&(a.op==='buy'?buy:a.op==='sell'?sell:buy||sell)) alertFire(a,`Stacked ${buy&&sell?'buy and sell':buy?'buy':'sell'} imbalance on the ${clock(c.t0)} bar`);
    }

}
function addAlert(spec){ALERTS.push({id:Date.now()+''+Math.floor(Math.random()*1e4),on:true,repeat:false,fired:0,...spec}); saveAlerts(); brkChanged()}

// live: trade by trade
function simStep(h){
  const p0=sim.p, st=stepPrice(h), act=st.act, g=st.g, dp=BK.on?bkHold(p0,st.dp):st.dp;
  sim.p+=dp;
  const n=poisson(18*act*(1+.25*Math.abs(dp)/VOL/(Math.sqrt(h)*g.sig))*h);
  for(let k=0;k<n;k++){
    const f=(k+.5)/n, pk=p0+dp*f;
    const buy=clamp(.5+.3*Math.tanh((pk-sim.lag)/5)+.06*Math.sign(g.drift),.08,.92);
    const side=rnd()<buy?1:-1, sz=lot(), bid=Math.floor(pk);
    addTrade(sim.t+h*f,side,sz,side>0?bid+1:bid);
    if(sz>=30&&rnd()<.5) sim.p+=side*(1+Math.floor(rnd()*2));
  }
  if(rnd()<.035*act*h*VOLM) sim.meta.push(...metaOrder(sim.t+h*rnd(),rnd()<clamp(.5+.3*Math.tanh((sim.p-sim.lag)/5),.1,.9)?1:-1,act));
  while(sim.meta.length&&sim.meta[0][0]<sim.t+h){const [tm,sd,z,walk]=sim.meta.shift(); if(walk) sim.p+=sd; const bid=Math.floor(sim.p); addTrade(Math.max(sim.t,tm),sd,z,sd>0?bid+1:bid)}
  sim.lag+=(sim.p-sim.lag)*Math.min(1,h/2.5);
  sim.t+=h;
  if(BK.on){bkMoveTo(Math.floor(sim.p)); bkStep(h)}
  if(sim.t>=sesEnd()-1e-9&&!RP.on&&!FEED.real) rollDay();
}
// a single print of >= BIG_MIN contracts with the same size distribution as lot() (P(lot >= 10) ~ 9.8%)
function bigLot(){const r=rnd()*.098; return r<.063?10+Math.floor(rnd()*6):r<.0965?16+Math.floor(rnd()*14):30+Math.floor(Math.pow(rnd(),1.6)*170)}
// history: one-second aggregates. The second is split into 2-6 sub-steps along a noisy path (Brownian bridge);
// volume lands unevenly on them and the buy/sell mix follows each micro move, so footprints and imbalances look like live ones.
const CS={path:new Float64Array(8),w:new Float64Array(8),xa:new Float64Array(8),xb:new Float64Array(8)};   // reused scratch buffers
function coarseStep(end){
  let h=CRYPTO||activity()<.5?2:1;   // quiet hours (ETH) and the 24-hour crypto days step two seconds at a time
  if(end&&sim.t+h>end) h=Math.max(.05,end-sim.t);
  const p0=sim.p, {act,dp,g}=stepPrice(h);
  sim.p+=dp;
  const n=poisson(18*act*(1+.25*Math.abs(dp)/VOL/(Math.sqrt(h)*g.sig))*h);
  if(n){
    const buy=clamp(.5+.3*Math.tanh((sim.p-sim.lag)/5)+.06*Math.sign(g.drift),.08,.92);
    let tot=Math.max(1,Math.round(n*3.3*(.7+.6*rnd())));
    const K=Math.min(n,2+Math.floor(rnd()*4)), path=CS.path, w=CS.w, xa=CS.xa, xb=CS.xb; let ws=0;
    for(let j=0;j<K;j++){
      xa[j]=0; xb[j]=0;
      const f=(j+1)/K; path[j]=j===K-1?sim.p:p0+dp*f+gauss()*g.sig*.55*Math.sqrt(f*(1-f));
      const x=-Math.log(1-rnd()); w[j]=x*x+.05; ws+=w[j];
    }
    // large prints come out of the same volume (totals stay realistic) and land on one sub-step each
    let impact=0; const bigs=[];
    for(let q=poisson(n*.098);q>0;q--){
      const sz=bigLot(); if(sz>tot) break; tot-=sz;
      const side=rnd()<buy?1:-1, j=Math.floor(rnd()*K), px=Math.floor(path[j])+(side>0?1:0);
      if(side>0) xa[j]+=sz; else xb[j]+=sz;
      bigs.push([sim.t+(j+.4)/K*.9*h+bigs.length*1e-4,px,sz,side]);
      if(sz>=30&&rnd()<.5) impact+=side*(1+Math.floor(rnd()*2));
    }
    if(bigs.length>1) bigs.sort((a,b)=>a[0]-b[0]);
    for(const b of bigs) BIG.push(b[0],b[1],b[2],b[3]);
    let rem=tot, remN=n, prev=p0;
    for(let j=0;j<K;j++){
      const pj=path[j], last=j===K-1;
      const vol=last?rem:Math.min(rem,Math.round(tot*w[j]/ws)); rem-=vol;
      const nk=last?Math.max(1,remN):Math.max(1,Math.round(n*w[j]/ws)); remN-=nk;
      const pb=clamp(buy+.28*Math.tanh((pj-prev)*.9)+(rnd()-.5)*.35,.03,.97);
      const av=Math.round(vol*pb), bv=vol-av, bid=Math.floor(pj), tt=sim.t+(j+.4)/K*.9*h;
      if(bv+xb[j]>0) addVol(tt,bid,bv+xb[j],0,Math.max(1,Math.round(nk*bv/Math.max(1,vol)))+(xb[j]?1:0));
      if(av+xa[j]>0) addVol(tt,bid+1,0,av+xa[j],Math.max(1,Math.round(nk*av/Math.max(1,vol)))+(xa[j]?1:0));
      prev=pj;
    }
    sim.p+=impact;
  }
  if(rnd()<.035*act*h*VOLM){const sd=rnd()<clamp(.5+.3*Math.tanh((sim.p-sim.lag)/5),.1,.9)?1:-1;
    for(const [tm_,s_,z,walk] of metaOrder(sim.t+rnd()*h*.4,sd,act)){const tm=end?Math.min(tm_,end-.001):tm_; if(walk) sim.p+=s_; const bid=Math.floor(sim.p), px=s_>0?bid+1:bid; addVol(tm,px,s_<0?z:0,s_>0?z:0,1); if(z>=BIG_MIN) BIG.push(tm,px,z,s_); if(BIGAGG.agg) aggPrint(tm,px,z,s_)}}
  if(D.day.v) finalize();
  sim.lag+=(sim.p-sim.lag)*(h>1?.64:.4);
  sim.t+=h;
}
const DAYSTATE=[];   // simulator state just before each session opened (a session is rebuilt from it)
function openSession(i){
  if(D.day) D.day.close=D.last;
  DAYSTATE[i]={p:sim.p,lag:sim.lag,act:sim.act,wander:sim.wander,anchor:sim.anchor,last:D.last,lastSide:D.lastSide};
  RS=daySeed(i);
  if(D.days.length&&!FEED.real&&!CRYPTO) sim.p+=gauss()*45*VOL;        // overnight gap (crypto never closes)
  sim.lag=sim.p; sim.reg=null; sim.t=i*DAY+OPEN; startDay(i);
  if(BK.on){bkInit(sim.p); BK.lastSnap=-1e9; D.last=BK.bid}   // before the first print, 'last' is the opening bid, not yesterday's close
}
function rollDay(){

/* ---------- data feeds ----------
   A feed writes the market into the store through addTrade (addVol for one-second history).
   history(i) builds a whole session at once, open(i) starts a session that step(h) then plays, h seconds of market time per call.
   Simulator: generated sessions. Imported ticks (CSV / JSON): real prints, played back in time order; the order book is
   synthesised around them. WebSocket: a live connection that pushes trades, quotes and book levels (see makeWsFeed). */
const SimFeed={kind:'sim',real:false,name:'Simulator',
  history(i){openSession(i); const e=i*DAY+CLOSE; while(sim.t<e-1e-9) coarseStep(e)},
  open(i){BK.on=true; openSession(i)},
  step(h){if(RP.on&&sim.t>=sesEnd()-1e-6) return false; simStep(h); return !RP.on||sim.t<sesEnd()-1e-6}};
function makeTickFeed(ds){
  return {kind:'csv',real:true,name:ds.meta.name,pos:0,end:0,
    history(i){const a=ds.dayA[i], b=ds.dayA[i+1], o=RP.poff; if(a<b) sim.p=ds.P[a]+o+.5; openSession(i); for(let k=a;k<b;k++) addTrade(ds.T[k],ds.S[k],ds.Z[k],ds.P[k]+o); sim.t=i*DAY+CLOSE},
    open(i){const a=ds.dayA[i], o=RP.poff; if(a<ds.dayA[i+1]) sim.p=ds.P[a]+o+.5; BK.on=true; openSession(i); this.pos=a; this.end=ds.dayA[i+1]},
    step(h){
      const end=sesEnd(); if(sim.t>=end-1e-6) return false;
      const t1=sim.t+h, o=RP.poff;
      while(this.pos<this.end&&ds.T[this.pos]<t1){const k=this.pos++; addTrade(ds.T[k],ds.S[k],ds.Z[k],ds.P[k]+o)}
      sim.t=t1; if(BK.on) bkStep(h); return sim.t<end-1e-6;
    },
    save(){return this.pos}, load(v){this.pos=v}};
}
let FEED=DS?makeTickFeed(DS):WSF||(BNL?makeBncFeed(BNL,INS):SimFeed);
// rebuilding never trades, alerts or pauses: the broker is switched off meanwhile
function quiet(fn){const b=BRK.on; BRK.on=false; RP.seeking=true; try{fn()}finally{BRK.on=b; RP.seeking=false}}
// play the open session up to T: trade by trade with the book running; a 24-hour crypto day runs its early hours in one-second steps
function fastForward(T){
  const F=T-5400; if(CRYPTO&&F>sim.t+60){const b=BK.on; BK.on=false; while(sim.t<F-1e-9) coarseStep(F); BK.on=b; if(b){bkInit(sim.p); BK.lastSnap=-1e9}}
  while(sim.t<T-1e-6) simStep(.1);
}
function buildDays(from,to){for(let i=from;i<to;i++){D.tkOn=i>=to-3; BK.on=false; FEED.history(i)}}   // tick bars for the last 3 sessions

/* ---------- rebuilding: drop sessions, checkpoints inside the replayed session ---------- */
let EPOCH=0;
function clearDerived(){
  EPOCH++;
  for(const B of [D.m1,D.tk]) for(const c of B){c._fa=c._fl=c._pw=undefined}
  for(const d of D.days){d._nk=d._tp=d._lv=undefined}
  if(!READY) return;   // the caches below are declared further down and still empty while the page starts
  for(const k in cache) delete cache[k]; pcache.clear(); DEVC.clear(); TPOC.clear(); domVAc=null;
}
const cutBars=(arr,T)=>{let a=0,b=arr.length; while(a<b){const m=(a+b)>>1; if(arr[m].t0<T)a=m+1; else b=m} arr.length=a};

  BIG.n=BIG.lower(T); BAG.n=BAG.lower(T); AG[0]=AG[1]=null; sim.meta=[]; HM.n=HM.lower(T); TR.n=TR.lower(T); TP.n=TP.lo=0; AT.clear(); LT=null; BK.on=false; BK.walls.length=0;

function cpRestore(cp){
  D.m1.length=cp.m1n; if(cp.m1) D.m1[cp.m1n-1]=cloneBar(cp.m1);
  D.tk.length=cp.tkn; if(cp.tk) D.tk[cp.tkn-1]=cloneBar(cp.tk);
  BIG.n=cp.big; BAG.n=cp.bag; AG[0]=cp.ag[0]&&{...cp.ag[0]}; AG[1]=cp.ag[1]&&{...cp.ag[1]}; HM.n=cp.hm; TR.n=cp.tr;
  TP.lo=Math.max(TP.lo,TP.n-TP.cap); TP.n=cp.tp; if(TP.lo>TP.n) TP.lo=TP.n;   // ring slots overwritten since then are not shown
  AT.clear(); for(const [k,v] of cp.at) AT.set(k,v.slice()); LT=cp.lt&&{...cp.lt};
  Object.assign(sim,cp.sim,{reg:cp.sim.reg&&{...cp.sim.reg},meta:cp.sim.meta.map(x=>x.slice())}); RS=cp.rs; D.last=cp.last; D.lastSide=cp.lastSide;
  const b=cp.bk; BK.on=b.on; BK.base=b.base; BK.bid=b.bid; BK.step=b.step; BK.lastSnap=b.lastSnap;
  BK.bs.fill(0); BK.ws.fill(0); BK.chg.fill(0); BK.bs.set(b.bs,b.i0); BK.ws.set(b.ws,b.i0); BK.chg.set(b.chg,b.i0); BK.walls=b.walls.map(w=>({...w}));
  const d=D.day; Object.assign(d,cp.day); d.prof=new Map(); d.mlo.fill(MNONE); d.mhi.fill(-MNONE);
  let j=D.m1.length; while(j>0&&D.m1[j-1].t0>=d.t0) j--;
  for(;j<D.m1.length;j++){const c=D.m1[j], mi=clamp(Math.floor((c.t0-d.t0)/60),0,NMIN-1);
    if(c.l<d.mlo[mi]) d.mlo[mi]=c.l; if(c.h>d.mhi[mi]) d.mhi[mi]=c.h;
    for(const [p,x] of c.lv){let y=d.prof.get(p); if(!y){y=[0,0]; d.prof.set(p,y)} y[0]+=x[0]; y[1]+=x[1]}}

}
// one 0.1 s step of the replayed session (a checkpoint every minute of market time)
function replayStep(){const ok=FEED.step(.1); if(sim.t>=RP.cpMax+60) cpSave(); return ok}
function stepOnce(){return RP.on?replayStep():FEED.step(.1)}
// build the world for a replay of session i, positioned at startS (seconds of the session's day) — synchronous
function replayBuild(i,startS){
  quiet(()=>{
    const from=Math.max(0,RP.poffChanged?0:Math.min(i-3,RP.on?RP.day:Infinity)); RP.poffChanged=false;
    truncateTo(from); buildDays(from,i);
    RP.on=true; RP.day=i; RP.cps=[]; RP.cpMax=-1e9; RP.ended=false; RP.reported=false; RP.hit=null;
    D.tkOn=true; FEED.open(i); TP.n=TP.lo=0; AT.clear(); LT=null; cpSave();
    RP.start=i*DAY+clamp(startS,OPEN,CLOSE-60);
    while(sim.t<RP.start-.05&&replayStep());
  });
  RP.id=Date.now().toString(36); RP.j0=JOURNAL.length; BRK.dayBal=ACC.balance; alPrev=D.last; alBars=D.m1.length;
}
// leave the replay: rebuild the simulator up to the live moment it was entered from
function replayExitBuild(){
  const L=RP.live.day, T=RP.live.t;
  quiet(()=>{
    const from=Math.max(0,Math.min(RP.day,L)-3);
    truncateTo(from); RP.on=false; RP.blind=false; RP.cps=[]; RP.day=-1;
    buildDays(from,L); D.tkOn=true; FEED.open(L); fastForward(T);
  });
  RP.live=null; BRK.dayBal=ACC.balance; alPrev=D.last; alBars=D.m1.length;
}

/* ---------- build the market: a month of history, then today ---------- */
if(FEED.kind==='sim'){
  // full sessions at one-second resolution (tick bars for the last 3), today trade by trade from the open to 11:20 ET with the order book running
  buildDays(0,CAL.length-1);
  const L=CAL.length-1, T=L*DAY+(CRYPTO?clamp(Math.floor(Date.now()/1000)%DAY,1800,DAY-120):RTH_O+6600); D.tkOn=true; FEED.open(L); fastForward(T);
}else if(FEED.kind==='csv'){
  // imported sessions are history; the last one is replayed from the regular open
  replayBuild(CAL.length-1,RTH_O); G.playing=false;
}else if(FEED.kind==='bnc'){
  // Binance: N days of history from candles, then today up to now, then live
  buildDays(0,CAL.length-1); D.tkOn=true; FEED.open(CAL.length-1); FEED.drain();
}else{
  D.tkOn=true; FEED.open(0); FEED.drain();
}

const cache={};
function merge(src,a,b){
  const f=src[a], l=src[b-1], lv=new Map(); let h=-Infinity,lo=Infinity,vol=0,delta=0,n=0,dmin=0,dmax=0;
  for(let i=a;i<b;i++){const c=src[i]; if(c.h>h)h=c.h; if(c.l<lo)lo=c.l; vol+=c.vol;
    // intrabar delta extremes: offset each sub-bar's running min/max by the delta accumulated before it
    if(delta+c.dmin<dmin)dmin=delta+c.dmin; if(delta+c.dmax>dmax)dmax=delta+c.dmax; delta+=c.delta; n+=c.n;
    for(const [p,x] of c.lv){let y=lv.get(p); if(!y){y=[0,0,0];lv.set(p,y)} y[0]+=x[0]; y[1]+=x[1]; y[2]+=x[2]}}
  return {t0:f.t0,o:f.o,h,l:lo,c:l.c,vol,delta,dmin,dmax,n,lv,vwap:l.vwap,sd:l.sd,cvd:l.cvd};
}
/* ---------- bar types ----------
   250T ticks · 30s seconds · 5m minutes · 2h hours · 1D sessions · 1W weeks (time bars)
   1000V volume · 8R range in ticks · 8RK Renko bricks in ticks · 500DT delta (event bars).
   Minute and longer bars come from the 1-minute store for the whole history; ticks in steps of 250 from the 250-trade store;
   everything else from the print record (TR), which covers the last 3 sessions and today, like tick bars. */
const BT_KIND={T:'ticks',s:'seconds',m:'minutes',h:'hours',D:'sessions',W:'weeks',V:'volume',R:'range',RK:'Renko',DT:'delta'};
const BT_PRE=['250T','500T','1000T','2000T','15s','30s','1m','2m','3m','5m','15m','30m','1h','4h','1D','1W','1000V','5000V','4R','8R','4RK','8RK','300DT','1000DT'];
const BTS={};
function btSpec(bt){
  if(BTS[bt]) return BTS[bt];
  const m=/^(\d+)(T|s|m|h|D|W|V|RK|R|DT)$/.exec(String(bt)); if(!m) return bt==='1m'?null:btSpec('1m');
  const n=Math.max(1,+m[1]), k=m[2]; let src='tr', mm=1;
  if(k==='T'&&n%250===0){src='tk'; mm=n/250}
  else if(k==='s'&&n%60===0){src='m1'; mm=n/60}
  else if(k==='m'){src='m1'; mm=n} else if(k==='h'){src='m1'; mm=n*60}
  else if(k==='D'||k==='W') src=k==='D'?'day':'week';
  return BTS[bt]={bt,n,k,src,m:mm,time:'smhDW'.includes(k)&&k.length===1,span:k==='s'?n:k==='m'?n*60:k==='h'?n*3600:0};
}
const btLabel=bt=>{const s=btSpec(bt); if(!s) return bt; return {T:`${s.n}T`,s:`${s.n}s`,m:`${s.n}m`,h:`${s.n}h`,D:s.n>1?`${s.n}D`:'Daily',W:s.n>1?`${s.n}W`:'Weekly',V:`${fK(s.n)} Vol`,R:`${s.n}R`,RK:`${s.n} Renko`,DT:`Δ${s.n}`}[s.k]};
const btEvent=bt=>{const s=btSpec(bt); return !!s&&!s.time};
function groupBars(bt,base,key){
  const c=cache[bt]||(cache[bt]={arr:[],st:[]});
  let j=Math.max(0,c.arr.length-1), i=j<c.st.length?c.st[j]:0; c.arr.length=j; c.st.length=j;
  while(i<base.length){const kk=key(i,c); let k=i+1; while(k<base.length&&key(k,c)===kk)k++; c.st.push(i); c.arr.push(merge(base,i,k)); i=k}
  for(let q=Math.max(0,j-1);q<c.arr.length-1;q++) pack(c.arr[q]);   // finished groups
  return c.arr;
}
function bars(bt){
  const sp=btSpec(bt)||btSpec('1m');
  if(sp.src==='tr') return trBars(bt,sp);
  if(sp.src==='day') return groupBars(bt,D.m1,i=>Math.floor(dayOf(D.m1[i].t0)/sp.n));
  if(sp.src==='week') return groupBars(bt,D.m1,i=>Math.floor(weekKey(clamp(dayOf(D.m1[i].t0),0,CAL.length-1))/sp.n));
  const base=D[sp.src], m=sp.m; if(m===1) return base;
  if(sp.src==='tk') return groupBars(bt,base,(i,c)=>{
    if(!c.d0){const first=new Map(); c.d0=i=>{const d=dayOf(base[i].t0); if(!first.has(d)){let k=i; while(k>0&&dayOf(base[k-1].t0)===d)k--; first.set(d,k)} return first.get(d)}}
    return dayOf(base[i].t0)*1e6+Math.floor((i-c.d0(i))/m)});
  const span=m*60; return groupBars(bt,base,i=>Math.floor(base[i].t0/span));
}
// session statistics (VWAP, σ, CVD) of an event bar come from the 1-minute bar at its last print
function trStamp(b,t){let a=0,z=D.m1.length-1; if(z<0) return; while(a<z){const m=(a+z+1)>>1; if(D.m1[m].t0<=t)a=m; else z=m-1} const c=D.m1[a]; b.vwap=c.vwap; b.sd=c.sd; b.cvd=c.cvd}
function trBar(t0,o){return {t0,o,h:o,l:o,c:o,vol:0,delta:0,dmin:0,dmax:0,lv:new Map(),vwap:o*TICK,sd:0,cvd:0,n:0,tl:t0}}
function trAdd(b,t,px,bv,av,n){
  if(px>b.h)b.h=px; if(px<b.l)b.l=px; b.c=px; b.vol+=bv+av; b.delta+=av-bv; b.n+=n; b.tl=t;
  if(b.delta<b.dmin)b.dmin=b.delta; if(b.delta>b.dmax)b.dmax=b.delta;
  let a=b.lv.get(px); if(!a){a=[0,0,0]; b.lv.set(px,a)} a[0]+=bv; a[1]+=av; a[2]+=n;
}
function trBars(bt,sp){
  const c=cache[bt]||(cache[bt]={arr:[],i:0,top:null,bot:null}), A=c.arr, N=sp.n, k=sp.k;
  let cur=A[A.length-1]||null;
  const close=b=>{if(b){trStamp(b,b.tl); pack(b)}};
  for(let i=c.i;i<TR.n;i++){
    const t=TR.t[i], px=TR.px[i], bv=TR.bv[i], av=TR.av[i], n=TR.k[i];
    if(k==='RK'){   // a brick closes when price moves N ticks beyond the last brick (2N to reverse)
      if(c.top==null){c.top=c.bot=px; cur=trBar(t,px); A.push(cur)}
      trAdd(cur,t,px,bv,av,n);
      while(px>=c.top+N||px<=c.bot-N){
        const up=px>=c.top+N, o=up?c.top:c.bot, cl=up?o+N:o-N;
        cur.o=o; cur.c=cl; cur.h=Math.max(o,cl); cur.l=Math.min(o,cl); close(cur);
        if(up){c.bot=c.top; c.top=cl} else{c.top=c.bot; c.bot=cl}
        cur=trBar(t,cl); A.push(cur);
      }
      continue;
    }
    let nb=!cur||dayOf(cur.t0)!==dayOf(t);
    if(!nb){
      if(k==='T') nb=cur.n>=N;
      else if(k==='s') nb=t>=cur.t0+N;
      else if(k==='V') nb=cur.vol>=N;
      else if(k==='R') nb=Math.max(cur.h,px)-Math.min(cur.l,px)>N;
      else if(k==='DT') nb=Math.abs(cur.delta)>=N;
    }
    if(nb){close(cur); cur=trBar(k==='s'?Math.floor(t/N)*N:t,px); A.push(cur)}
    trAdd(cur,t,px,bv,av,n);
  }
  c.i=TR.n; if(cur) trStamp(cur,cur.tl);
  return A;
}
// incremental series: state is kept after the last finished bar, the live (last) bar is recomputed every call
const SER=new WeakMap();
function serCache(B,key){let m=SER.get(B); if(!m){m=new Map(); SER.set(B,m)} let c=m.get(key); if(!c||c.ep!==EPOCH||B.length<c.f+1){c={ep:EPOCH,f:0,r:[],st:null}; m.set(key,c)} return c}
function rsiArr(B,per){
  const n=B.length, c=serCache(B,'rsi'+per), r=c.r; if(!n) return r; if(!c.st){c.st={g:0,l:0}; r[0]=50}
  const step=(i,st)=>{const d=B[i].c-B[i-1].c, up=d>0?d:0, dn=d<0?-d:0; if(i<=per){st.g+=up/per; st.l+=dn/per}else{st.g=(st.g*(per-1)+up)/per; st.l=(st.l*(per-1)+dn)/per} return st.l===0?100:100-100/(1+st.g/st.l)};
  for(let i=c.f+1;i<=n-2;i++){r[i]=step(i,c.st); c.f=i}
  if(n>1&&n-1>c.f) r[n-1]=step(n-1,{...c.st}); r.length=n; return r;
}
function emaArr(B,per){
  const n=B.length, c=serCache(B,'ema'+per), r=c.r, k=2/(per+1); if(!n) return r; if(!c.st){c.st={e:B[0].c}; r[0]=B[0].c}
  for(let i=c.f+1;i<=n-2;i++){c.st.e=B[i].c*k+c.st.e*(1-k); r[i]=c.st.e; c.f=i}
  if(n>1&&n-1>c.f) r[n-1]=B[n-1].c*k+c.st.e*(1-k); r.length=n; return r;
}
function ranges(B,minutes){
  const c=serCache(B,'rng'+minutes), out=c.r, span=minutes*60;
  if(!c.st){c.st={a:0}} let i=c.st.a; while(out.length&&out[out.length-1].a>=i) out.pop();   // the last range is rebuilt
  let cur=null;
  for(;i<B.length;i++){const b=B[i], g=dayOf(b.t0)*1000+Math.floor((sod(b.t0)-OPEN)/span);
    if(!cur||cur.g!==g){cur={g,a:i,b:i,hi:b.h,lo:b.l,vol:b.vol}; out.push(cur); c.st.a=i}
    else{cur.b=i; if(b.h>cur.hi)cur.hi=b.h; if(b.l<cur.lo)cur.lo=b.l; cur.vol+=b.vol}}
  c.f=Math.max(0,B.length-2); return out;
}
function valueArea(vol,pct){
  let poc=0; for(let i=1;i<vol.length;i++) if(vol[i]>vol[poc]) poc=i;
  let tot=0; for(const v of vol) tot+=v;
  let up=poc,dn=poc,acc=vol[poc]; const tg=tot*(pct||70)/100;
  while(acc<tg&&(up<vol.length-1||dn>0)){const a=up<vol.length-1?vol[up+1]:-1,b=dn>0?vol[dn-1]:-1; if(a>=b){up++;acc+=a}else{dn--;acc+=b}}
  return {poc,up,dn,tot};
}

function sma(a,p){const r=new Array(a.length).fill(NaN); let s=0; for(let i=0;i<a.length;i++){s+=a[i]; if(i>=p) s-=a[i-p]; if(i>=p-1) r[i]=s/p} return r}

function rma(a,p){const r=new Array(a.length).fill(NaN); let e=NaN, s=0, n=0; for(let i=0;i<a.length;i++){const v=a[i]; if(isNaN(v)) continue; if(n<p){s+=v; n++; if(n===p){e=s/p; r[i]=e}} else{e=(e*(p-1)+v)/p; r[i]=e}} return r}

/* ---------- footprint engine ----------
   fpAnalyze works tick by tick on a bar's price ladder (imbalances, stacks, POC, value area, auction patterns) and caches
   the result on the bar until its volume or the settings change. fpRows then groups ticks into display rows, so grouping
   never changes which levels count as imbalanced. */
const fpSig=F=>[F.imbType,F.ratio,F.ratio2,F.ratio3,F.minVol,F.deltaF,F.zero1?1:0,F.stackN,F.stackGap,F.vaPct,F.absMult,F.absTicks,F.exhMax,F.minTrade].join('|');
// optional trade-size filter: rebuild the ladder from the big-print tape (prints >= BIG_MIN are recorded individually)
function fpLv(c,t1,F){
  if(!(F.minTrade>0)) return c.lv;
  const min=Math.max(BIG_MIN,+F.minTrade), k=min+'|'+c.vol;
  if(c._fl&&c._fl.k===k) return c._fl.m;
  const m=new Map();
  for(let i=BIG.lower(c.t0);i<BIG.n&&BIG.t[i]<t1;i++){
    if(BIG.sz[i]<min) continue;
    const p=BIG.px[i]; let y=m.get(p); if(!y){y=[0,0,0];m.set(p,y)}
    if(BIG.sd[i]>0) y[1]+=BIG.sz[i]; else y[0]+=BIG.sz[i]; y[2]++;
  }
  c._fl={k,m}; return m;
}
function fpAnalyze(c,F,sig,t1){
  const key=sig+'|'+c.vol;
  if(c._fa&&c._fa.key===key) return c._fa;
  const lv=fpLv(c,t1,F); let lo=Infinity,hi=-Infinity;
  for(const p of lv.keys()){if(p<lo)lo=p; if(p>hi)hi=p}
  if(!isFinite(lo)) return c._fa={key,n:0};
  const n=hi-lo+1, bid=new Float64Array(n), ask=new Float64Array(n), trd=new Float64Array(n), vol=new Float64Array(n);
  for(const [p,x] of lv){const i=p-lo; bid[i]=x[0]; ask[i]=x[1]; trd[i]=x[2]||0}
  let poc=0,tot=0;
  for(let i=0;i<n;i++){vol[i]=bid[i]+ask[i]; tot+=vol[i]; if(vol[i]>vol[poc]) poc=i}
  let up=poc,dn=poc,acc=vol[poc]; const tgt=tot*F.vaPct/100;
  while(acc<tgt&&(up<n-1||dn>0)){const a=up<n-1?vol[up+1]:-1,b=dn>0?vol[dn-1]:-1; if(a>=b){up++;acc+=a}else{dn--;acc+=b}}
  // imbalance level 0-3 at every tick; diagonal compares ask(p) with bid(p-1) and bid(p) with ask(p+1)
  const r1=F.ratio/100, r2=F.ratio2/100, r3=F.ratio3/100, diag=F.imbType!=='horiz', al=new Uint8Array(n), bl=new Uint8Array(n);
  const lvl=(v,o)=>{ if(v<F.minVol||v-o<F.deltaF||(o<=0&&!F.zero1)) return 0; const r=v/Math.max(1,o);
    return r<r1?0:!(r2>0)||r<r2?1:!(r3>0)||r<r3?2:3 };
  for(let i=0;i<n;i++){
    al[i]=lvl(ask[i],diag?(i>0?bid[i-1]:0):bid[i]);
    bl[i]=lvl(bid[i],diag?(i<n-1?ask[i+1]:0):ask[i]);
  }
  // stacked imbalances: N or more imbalanced ticks in a row on one side, with an allowed gap
  const stacks=[];
  for(const [arr,side] of [[al,1],[bl,-1]]){
    let s=-1,e=-1,cnt=0,gap=0;
    for(let i=0;i<=n;i++){
      if(i<n&&arr[i]){if(s<0){s=i;cnt=0} cnt++; gap=0; e=i; continue}
      if(s<0) continue;
      gap++;
      if(gap>F.stackGap||i===n){if(cnt>=F.stackN) stacks.push({side,lo:lo+s,hi:lo+e}); s=-1; cnt=0; gap=0}
    }
  }
  // absorption: heavy passive volume that price then rejects; exhaustion: a thin print at the bar extreme
  const avg=tot/n; let absB=-1,absA=-1;
  if(n>=3) for(let i=0;i<n;i++){
    if(bid[i]>=F.absMult*avg&&bid[i]>=F.minVol&&c.c-(lo+i)>=F.absTicks&&(absB<0||bid[i]>bid[absB])) absB=i;
    if(ask[i]>=F.absMult*avg&&ask[i]>=F.minVol&&(lo+i)-c.c>=F.absTicks&&(absA<0||ask[i]>ask[absA])) absA=i;
  }
  return c._fa={key,lo,hi,n,bid,ask,trd,vol,tot,poc:lo+poc,vah:lo+up,val:lo+dn,al,bl,stacks,
    ufHi:n>1&&bid[n-1]>0&&ask[n-1]>0, ufLo:n>1&&bid[0]>0&&ask[0]>0,
    absB:absB<0?null:lo+absB, absA:absA<0?null:lo+absA,
    exHi:n>=4&&vol[n-1]<=F.exhMax&&vol[n-1]<avg*.25, exLo:n>=4&&vol[0]<=F.exhMax&&vol[0]<avg*.25};
}
function fpRows(A,rt){
  if(A._r&&A._r.rt===rt) return A._r;
  const g0=Math.floor(A.lo/rt), rows=[];
  for(let i=0;i<A.n;i++){
    const p=A.lo+i, gi=Math.floor(p/rt)-g0; let r=rows[gi];
    if(!r) r=rows[gi]={k:(gi+g0)*rt,b:0,a:0,t:0,al:0,bl:0,va:false,poc:false};
    r.b+=A.bid[i]; r.a+=A.ask[i]; r.t+=A.trd[i];
    if(A.al[i]>r.al) r.al=A.al[i]; if(A.bl[i]>r.bl) r.bl=A.bl[i]; if(p>=A.val&&p<=A.vah) r.va=true;
  }
  const out=rows.filter(Boolean); let mx=1,md=1,mt=1,ms=1,pi=-1;
  out.forEach((r,i)=>{const v=r.a+r.b; if(v>mx){mx=v;pi=i} const d=Math.abs(r.a-r.b); if(d>md)md=d; if(r.t>mt)mt=r.t; if(r.a>ms)ms=r.a; if(r.b>ms)ms=r.b});
  if(pi>=0) out[pi].poc=true;

function indAt(P,p){
  const g=P.V.g; if(!g||P.S.view!=='chart'||p.x>g.plotW) return null;
  const I=effInd(P.S), B=g.B;
  for(const r of g.regs) if(p.y>=r.a&&p.y<r.b) return r.id;
  if(p.y>=g.pH) return null;
  for(let k=g.bigs.length-1;k>=0;k--){const [x,y,r]=g.bigs[k]; if(Math.hypot(p.x-x,p.y-y)<=r+2) return 'big'}
  const i=g.barAt(p.x), c=B[i]; if(!c) return null;
  const near=v=>isFinite(v)&&Math.abs(g.yOf(v)-p.y)<=5;
  for(const Q of P.S.studies||[]){const x=STUDY_BY[Q.id]; if(!Q.on||!x||x.place!=='price') continue; let R=null; try{R=studyRun(P,Q,B)}catch(e){} if(!R||R.err) continue;
    if((R.lines||[]).some(L=>near(L.v[i]))||(R.hlines||[]).some(h=>i>=h.a&&i<=h.b&&near(h.p))) return 'st:'+Q.uid}
  if(I.vwap.on){const Q=I.vwap; if([0,...[1,2,3].filter(k=>Q['b'+k])].some(k=>near((c.vwap+k*c.sd)/TICK)||near((c.vwap-k*c.sd)/TICK))) return 'vwap'}
  if(I.ema.on&&[I.ema.p1,I.ema.p2].some(q=>near(emaArr(B,Math.max(2,+q))[i]))) return 'ema';
  if(I.prof.on&&p.x>=g.plotW-g.PW) return 'prof';
  if(I.fp.on&&g.fpOn){const x=g.xOf(i), pp=g.pAt(p.y); if(Math.abs(p.x-x)<=g.bw/2&&pp>=c.l-1.5&&pp<=c.h+1.5) return 'fp'}
  if(I.rng.on){const r=ranges(B,+I.rng.minutes).find(r=>i>=r.a&&i<=r.b); if(r&&(near(r.hi)||near(r.lo))) return 'rng'}
  return null;
}

    const x0=x1-tw-18; placed.push({y,x0,x1});
    ctx.fillStyle=hexA(col,.92); ctx.fillRect(x0,y-8,tw,16); ctx.fillStyle='#0b0710'; ctx.textAlign='left'; ctx.fillText(txt,x0+6,y+.5);
    ctx.fillStyle='#16121b'; ctx.fillRect(x1-17,y-8,17,16); ctx.strokeStyle=hexA(col,.92); ctx.lineWidth=1; ctx.strokeRect(x1-16.5,y-7.5,16,15);
    ctx.fillStyle=col; ctx.textAlign='center'; ctx.fillText('✕',x1-8.5,y+.5);

  };

    box(`${ordLabel(o)} @ ${fP(px)} · ${tk>0?'+':''}${tk}t${usd!=null?` · ${usd>=0?'+':''}$${usd.toFixed(0)}`:''}`,y,col,'order',o.id,R-4);
  }

    ctx.strokeStyle=hexA('#ffffff',.8); ctx.lineWidth=1.4; ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(R,y); ctx.stroke();
    box(`${BRK.q>0?'LONG':'SHORT'} ${Math.abs(BRK.q)} @ ${fP(BRK.avg)} · ${p>=0?'+':''}$${p.toFixed(0)}`,y,col,'pos',0,R-4);
  }

    if(f.t>sim.t) continue;

function orderHit(P,p){

// Long / Short drawing outcome from the 1-minute bars after it starts (bug 5): waiting, open, target or stop
function posStatus(d){
  if(d.t0>sim.t) return {s:'wait'};
  let a=0,b=D.m1.length; while(a<b){const m=(a+b)>>1; if(D.m1[m].t0+60<=d.t0)a=m+1; else b=m}
  const L=d.type==='long'; let tIn=null, hi=-Infinity, lo=Infinity;
  const ex=(s,i)=>({s,tIn,tOut:Math.max(tIn,D.m1[i].t0+30),mfe:L?Math.max(hi,s==='target'?d.target:d.entry):Math.min(lo,s==='target'?d.target:d.entry),mae:L?Math.min(lo,s==='stop'?d.stop:d.entry):Math.max(hi,s==='stop'?d.stop:d.entry)});
  for(let i=a;i<D.m1.length;i++){
    const c=D.m1[i]; if(c.t0>d.t1) break;
    if(tIn==null){if(c.l<=d.entry&&c.h>=d.entry) tIn=Math.max(d.t0,c.t0+(i<D.m1.length-1?20:0)); else continue}
    const hitS=L?c.l<=d.stop:c.h>=d.stop, hitT=L?c.h>=d.target:c.l<=d.target;
    if(hitS) return ex('stop',i); if(hitT) return ex('target',i);    // both in one bar: count the stop (conservative)
    if(c.h>hi) hi=c.h; if(c.l<lo) lo=c.l;
  }
  const s=tIn!=null?'open':d.t1<sim.t?'expired':'wait';
  return {s,tIn,tOut:null,mfe:tIn!=null?(L?Math.max(hi,d.entry):Math.min(lo,d.entry)):null,mae:tIn!=null?(L?Math.min(lo,d.entry):Math.max(hi,d.entry)):null};
}

/* ---------- time zones: "ET seconds" = UTC epoch seconds shifted to New York wall time (DST aware) ---------- */
function tzOff(ms,zone){   // seconds east of UTC in a zone at a UTC instant, cached per hour
  const Z=tzOff.Z||(tzOff.Z={}), z=Z[zone]||(Z[zone]={f:new Intl.DateTimeFormat('en-US',{timeZone:zone,hourCycle:'h23',year:'numeric',month:'numeric',day:'numeric',hour:'numeric',minute:'numeric',second:'numeric'}),c:new Map()});
  const h=Math.floor(ms/36e5); let o=z.c.get(h);
  if(o==null){const p={}; for(const x of z.f.formatToParts(new Date(h*36e5))) p[x.type]=x.value; o=(Date.UTC(+p.year,+p.month-1,+p.day,+p.hour%24,+p.minute,+p.second)-h*36e5)/1000; z.c.set(h,o)}
  return o;
}
function etSec(ms){return ms/1000+tzOff(ms,'America/New_York')}
// wall-clock time in a zone (as if it were UTC) to ET seconds
function wallToEt(w,zone){
  if(zone==='America/New_York') return w/1000;
  if(zone==='UTC') return etSec(w);
  let u=w-tzOff(w,zone)*1000; u=w-tzOff(u,zone)*1000; return etSec(u);
}

function idb(){return new Promise((res,rej)=>{const r=indexedDB.open('potik',2);

  r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error)})}

  const m=o.map, st=parseStamp(m.date>=0?r[m.date]+' '+r[m.time]:r[m.time]); if(!st) return null;
  const price=+r[m.price]; if(!(price>0)) return null;
  const et=st.utc?etSec(st.w):wallToEt(st.w,o.tz), size=m.size>=0?Math.round(+r[m.size]):1; if(!(size>0)) return null;
  const sv=m.side>=0?String(r[m.side]).trim().toUpperCase():'';   // A / B = traded at the ask / at the bid
  let sd=o.ab&&(sv==='A'||sv==='B')?(sv==='A'?1:-1):sv?sideOf(sv):0; if(o.flip) sd=-sd;
  if(!sd&&m.bid>=0&&m.ask>=0){const b=+r[m.bid], a=+r[m.ask]; if(a>0&&price>=a) sd=1; else if(b>0&&price<=b) sd=-1}
  return [et,price,size,sd];
}
function parseTicksCore(text,o,progress){
  const t=[], px=[], sz=[], sd=[]; let bad=0, lastPx=0, lastSd=1;
  const push=(et,price,size,s)=>{const p=Math.round(price/o.tick); if(!s) s=p>lastPx?1:p<lastPx?-1:lastSd; lastPx=p; lastSd=s; t.push(et); px.push(p); sz.push(size); sd.push(s)};
  const tr=text.trimStart();
  if(tr[0]==='['||tr[0]==='{'){
    let arr=JSON.parse(tr); if(!Array.isArray(arr)) arr=arr.trades||arr.data||arr.ticks||[];
    for(const x of arr){const r=Array.isArray(x)?{t:x[0],price:x[1],size:x[2],side:x[3]}:x;
      const tv=r.t??r.time??r.timestamp??r.ts, st=typeof tv==='number'||/^\d+(\.\d+)?$/.test(String(tv))?parseStamp(String(tv)):parseStamp(tv);
      const price=+(r.price??r.p??r.last), size=Math.round(+(r.size??r.s??r.qty??r.volume??1));
      if(!st||!(price>0)||!(size>0)){bad++; continue}
      let s=sideOf(r.side??r.aggressor); if(o.flip) s=-s; push(st.utc?etSec(st.w):wallToEt(st.w,o.tz),price,size,s)}
  }else{
    const lines=text.split(/\r?\n/), split=l=>l.split(o.delim).map(x=>x.trim().replace(/^"|"$/g,''));
    for(let i=o.head?1:0;i<lines.length;i++){
      const l=lines[i]; if(!l) continue; const r=csvRow(split(l),o); if(!r){bad++; continue} push(r[0],r[1],r[2],r[3]);
      if(i%100000===0&&progress) progress(i/lines.length);
    }
  }
  const n=t.length, idx=new Uint32Array(n); let sorted=true; for(let i=0;i<n;i++){idx[i]=i; if(i&&t[i]<t[i-1]) sorted=false}
  if(!sorted) idx.sort((a,b)=>t[a]-t[b]||a-b);
  const T=new Float64Array(n), PX=new Int32Array(n), SZ=new Int32Array(n), SD=new Int8Array(n);
  for(let i=0;i<n;i++){const k=idx[i]; T[i]=t[k]; PX[i]=px[k]; SZ[i]=sz[k]; SD[i]=sd[k]}
  return {raw:{t:T,px:PX,sz:SZ,sd:SD},bad};
}
// parsing runs in a Web Worker (the page stays responsive on files with millions of rows); if workers are unavailable, here
function parseTicks(file,o,progress){
  return new Promise((res,rej)=>{
    let w=null;
    try{
      const src=[tzOff,etSec,wallToEt,parseStamp,sideOf,csvRow,parseTicksCore].map(f=>f.toString()).join('\n')+
        `\nonmessage=async e=>{try{const text=await e.data.file.text(); const r=parseTicksCore(text,e.data.o,f=>postMessage({p:f})); postMessage({done:r},[r.raw.t.buffer,r.raw.px.buffer,r.raw.sz.buffer,r.raw.sd.buffer])}catch(err){postMessage({err:String(err&&err.message||err)})}}`;
      const url=URL.createObjectURL(new Blob([src],{type:'text/javascript'})); w=new Worker(url); URL.revokeObjectURL(url);
    }catch(e){w=null}
    const local=async()=>{try{const text=await file.text(); res(parseTicksCore(text,o,null))}catch(err){rej(err)}};
    if(!w){progress&&progress(0); setTimeout(local,30); return}
    w.onmessage=e=>{const d=e.data; if(d.p!=null){progress&&progress(d.p); return} w.terminate(); if(d.err) rej(new Error(d.err)); else res(d.done)};
    w.onerror=e=>{e.preventDefault&&e.preventDefault(); w.terminate(); local()};
    w.postMessage({file,o});
  });
}

const nextFrame=()=>new Promise(r=>requestAnimationFrame(()=>setTimeout(r,0)));
async function busy(msg){$('#busyMsg').textContent=msg; $('#busy').hidden=false; await nextFrame(); await nextFrame()}
const unbusy=()=>{$('#busy').hidden=true};
const etOf=s=>(s-TOFF+DAY)%DAY, sesOf=et=>(et+TOFF)%DAY;   // session seconds ⇄ New York seconds
function setPlaying(v){G.playing=v; const b=$('#pp'); b.textContent=v?'Pause':'Play'; b.setAttribute('aria-pressed',!v)}
// jumps never carry a position across: it is closed at the current price first
function closeOut(){if(BRK.orders.length) cancelAll(); if(BRK.q){placeOrder({side:-Math.sign(BRK.q),type:'MKT',qty:Math.abs(BRK.q),role:'exit'}); toast('Position closed before the jump','info')}}
function afterJump(){alPrev=D.last; alBars=D.m1.length; for(const P of panes){P.V.scroll=0; P.V.tsN=null; P.V.tsOff=0} allDirty(); syncReplayBar(true)}
// go to time T of the replayed session: back = nearest checkpoint, then forward
async function seekTo(T){
  if(!RP.on) return;
  const d0=RP.day*DAY+OPEN, d1=RP.day*DAY+CLOSE; T=clamp(T,d0,d1);
  if(Math.abs(T-sim.t)<.05) return;
  const far=T-sim.t>1800; if(far) await busy('Fast-forwarding…');
  try{
    if(T<sim.t){closeOut(); let cp=RP.cps[0]; for(const c of RP.cps){if(c.t<=T+1e-6) cp=c; else break}
      quiet(()=>{cpRestore(cp); RP.ended=false; RP.reported=false; while(sim.t<T-.05&&replayStep());})}
    else{RP.seeking=true; try{while(sim.t<T-.05&&replayStep());}finally{RP.seeking=false}}
  }finally{if(far) unbusy()}
  afterJump();
}
// one bar of the active chart forward or back
function stepBar(dir){
  if(!RP.on) return; const bt=active&&active.S.view==='chart'?active.S.bt:'1m', sp=btSpec(bt)||btSpec('1m');
  if(sp.span){const span=sp.span, k=Math.floor(sim.t/span+1e-9); seekTo(dir>0?(k+1)*span:(sim.t-k*span<.15?(k-1)*span:k*span)); return}
  if(sp.k==='D'||sp.k==='W'){seekTo(dir>0?RP.day*DAY+CLOSE:RP.start); return}
  if(dir>0){const n0=bars(bt).length; let tn=TR.n, j=0; RP.seeking=true;
    try{while(replayStep()){if(TR.n!==tn&&++j%5===0){tn=TR.n; if(bars(bt).length!==n0) break}}}finally{RP.seeking=false} afterJump(); return}
  const B=bars(bt); if(!B.length) return; let i=B.length-1; if(sim.t-B[i].t0<.15&&i>0) i--; seekTo(B[i].t0);
}
async function startReplay(i,startEt,opt){
  closeDialog(); await busy('Building the replay…');
  try{
    closeOut();
    if(!RP.on&&FEED.kind==='sim') RP.live={day:D.days.length-1,t:sim.t};
    if(FEED.kind==='csv'){const np=opt.blind?(Math.random()<.5?-1:1)*(400+Math.floor(Math.random()*2000)):0; if(np!==RP.poff){RP.poff=np; RP.poffChanged=true}}
    RP.blind=!!opt.blind; RP.big=opt.big||0;
    replayBuild(i,sesOf(startEt));
  }finally{unbusy()}
  setPlaying(false); $('#rbar').hidden=false; updateSource(); afterJump();
  toast(RP.blind?'Blind session ready · press Play':`Replay ${realDate(i*DAY)} from ${clock(sim.t)} · press Play`,'info');
}
async function exitReplay(){
  if(!RP.on||!RP.live) return;
  await busy('Back to the live market…'); try{closeOut(); replayExitBuild()}finally{unbusy()}
  $('#rbar').hidden=true; setPlaying(true); updateSource(); afterJump();
}

// session report: your trades in this replay against the session itself
function openReport(){
  if(!RP.on) return;

        const m=row('Message on connect (optional)',el_('input')); m.type='text'; m.value=draft.wsSub; m.addEventListener('input',()=>{draft.wsSub=m.value; changed()});
        if(FEED.kind==='ws') fs.appendChild(el_('p','acnote',`Now: ${FEED.status} · ${FEED.n} prints received${FEED.book?' · book from the feed':' · synthesised book'}.`));
      }
    };
    render(); changed();
    apply.addEventListener('click',()=>{if(draft.src==='ws'&&!/^wss?:\/\//.test(draft.wsUrl)){toast('Enter a ws:// or wss:// address','info'); return} DCFG=draft; saveDcfg(); location.reload()});
    // data sets
    const list=body.querySelector('.dlist');
    const showSets=()=>{list.innerHTML=sets.length?`<table class="atbl"><tr><th>Name</th><th>Instrument</th><th>Prints</th><th>From</th><th>To</th><th></th></tr>${sets.map(m=>`<tr><td>${esc(m.name)}</td><td>${m.sym}</td><td>${fK(m.n)}</td><td>${m.from}</td><td>${m.to}</td><td><button type="button" class="btn2 sm" data-use="${m.id}">Use</button> <button type="button" class="btn2 sm danger" data-del="${m.id}">Delete</button></td></tr>`).join('')}</table>`:'<p class="acnote">None yet.</p>'};
    showSets();
    list.addEventListener('click',async e=>{const u=e.target.closest('[data-use]'), d=e.target.closest('[data-del]');
      if(u){const m=sets.find(x=>x.id===u.dataset.use); DCFG={...DCFG,src:'csv',ds:m.id,sym:m.sym}; saveDcfg(); location.reload()}
      if(d){await dsDelete(d.dataset.del); sets=sets.filter(x=>x.id!==d.dataset.del); if(DCFG.src==='csv'&&DCFG.ds===d.dataset.del){DCFG.src='sim'; saveDcfg()} showSets(); render()}});
    // import
    const fin=body.querySelector('.dfile'), imp=body.querySelector('.dimp');
    fin.addEventListener('change',async()=>{
      const file=fin.files&&fin.files[0]; if(!file) return;
      imp.innerHTML='<p class="acnote">Reading…</p>'; let text; try{text=await file.slice(0,262144).text()}catch(err){imp.innerHTML=`<p class="acnote">Could not read the file: ${esc(err.message)}</p>`; return}   // the first 256 KB are enough to recognise the format
      const json=/^\s*[\[{]/.test(text), sn=json?null:csvSniff(text);
      if(!json&&!sn){imp.innerHTML='<p class="acnote">The file is empty.</p>'; return}
      const o={map:sn?sn.map:{},delim:sn&&sn.delim,head:sn&&sn.head,ab:sn&&sn.ab,tz:'America/New_York',flip:false,sym:DS?DS.meta.sym:DCFG.sym,name:file.name.replace(/\.[^.]+$/,'')};
      imp.innerHTML=''; const f=el_('div','fields'); imp.appendChild(f);
      const row=(label,ctl)=>{const r=el_('label','frow'); r.append(el_('span',null,label),ctl); f.appendChild(r); return ctl};
      const pv=el_('div','dprev');
      const preview=()=>{
        if(json){pv.innerHTML='<p class="acnote">JSON: an array of {t, price, size, side} objects or [t, price, size, side] rows.</p>'; return}
        o.tick=INSTR[o.sym].tick;
        const rows=sn.rows.map(r=>csvRow(r,o));
        pv.innerHTML=`<table class="atbl"><tr><th>Date</th><th>Time (New York)</th><th>Price</th><th>Size</th><th>Side</th></tr>${rows.map(r=>r?`<tr><td>${new Date(r[0]*1000).toISOString().slice(0,10)}</td><td>${new Date(r[0]*1000).toISOString().slice(11,23)}</td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]>0?'Buy':r[3]<0?'Sell':'from price'}</td></tr>`:'<tr><td colspan="5" class="dn">not readable with these settings</td></tr>').join('')}</table>`;
      };
      if(!json){
        for(const [k,lbl] of [['time','Time'],['date','Date (if separate)'],['price','Price'],['size','Size'],['side','Aggressor side'],['bid','Bid'],['ask','Ask']]){
          const s=row(lbl+' column',el_('select')); const n=el_('option',null,'—'); n.value=-1; s.appendChild(n);
          sn.names.forEach((nm,i)=>{const x=el_('option',null,nm); x.value=i; s.appendChild(x)}); s.value=o.map[k];
          s.addEventListener('change',()=>{o.map[k]=+s.value; preview()});
        }
      }
      const tz=row('Times without a zone are in',el_('select')); TZS.forEach(([v,t])=>{const x=el_('option',null,t); x.value=v; tz.appendChild(x)}); tz.addEventListener('change',()=>{o.tz=tz.value; preview()});
      const ins=row('Instrument',el_('select')); Object.keys(INSTR).forEach(k=>{const x=el_('option',null,`${k} · tick ${INSTR[k].tick}`); x.value=k; ins.appendChild(x)}); ins.value=o.sym; ins.addEventListener('change',()=>{o.sym=ins.value; preview()});
      const fl=row('Swap buy and sell',el_('input')); fl.type='checkbox'; fl.addEventListener('change',()=>{o.flip=fl.checked; preview()});
      const nm=row('Name',el_('input')); nm.type='text'; nm.value=o.name; nm.addEventListener('input',()=>{o.name=nm.value.trim()||file.name});
      imp.appendChild(pv); preview();
      const act=el_('div','dact'), go=el_('button','btn2','Import'), msg=el_('p','acnote'); go.type='button'; act.appendChild(go); imp.append(act,msg);
      go.addEventListener('click',async()=>{
        go.disabled=true; o.tick=INSTR[o.sym].tick; msg.textContent='Parsing…';
        try{
          const {raw,bad}=await parseTicks(file,o,f=>{msg.textContent=`Parsing… ${Math.round(f*100)}% (in the background)`});
          const n=raw.t.length; if(!n){msg.textContent='No prints could be read. Check the columns and the preview.'; go.disabled=false; return}
          const iso=x=>new Date(x*1000).toISOString().slice(0,10);
          const meta={id:Date.now().toString(36),name:o.name||file.name,sym:o.sym,n,from:iso(raw.t[0]),to:iso(raw.t[n-1]),created:Date.now()};
          msg.textContent='Saving…'; await dsSave(meta,raw); sets.push(meta); showSets(); render();
          msg.innerHTML=`Imported ${fK(n)} prints from ${meta.from} to ${meta.to}${bad?` (${bad} rows skipped)`:''}. `;
          const use=el_('button','btn2 sm','Use it now'); use.type='button'; use.addEventListener('click',()=>{DCFG={...DCFG,src:'csv',ds:meta.id,sym:meta.sym}; saveDcfg(); location.reload()}); msg.appendChild(use);
        }catch(err){console.error(err); msg.textContent='Import failed: '+err.message; go.disabled=false}
      });
    });
  });
}

/* ---------- linked windows: same colour = same time (scroll) and a shared crosshair ---------- */
const LINK_COL=['','#7ee0d4','#ffd166','#8fd3ff'], LINK_NAME=['','A','B','C'];
function linkSync(P,force){
  if(!P||!P.S.link||P.S.view!=='chart'||!P.V.g) return;
  const g=P.V.g, live=P.V.scroll>=-.5, t=g.tAt(g.R);
  for(const Q of panes){
    if(Q===P||Q.S.link!==P.S.link||Q.S.view!=='chart') continue;
    if(live){if(Q.V.scroll!==0){Q.V.scroll=0; Q.dirty=true} continue}
    const B=bars(Q.S.bt), n=B.length; if(!n) continue; let a=0,z=n-1; while(a<z){const m=(a+z+1)>>1; if(B[m].t0<=t)a=m; else z=m-1}
    const span=a<n-1?B[a+1].t0-B[a].t0:barSecs(Q.S.bt,B), fr=clamp((t-B[a].t0)/Math.max(1e-6,span),0,1), sc=a+fr-(n-1)-.5;
    if(Math.abs(Q.V.scroll-sc)>.01){Q.V.scroll=sc; Q.dirty=true}
  }
}
/* ---------- render errors: logged, shown on the window, retried a few times instead of every frame ---------- */
const DIAG=[];
function renderFail(P,err){
  P.errN=(P.errN||0)+1; const msg=(err&&err.message)||String(err), d0=DIAG[0];
  if(d0&&d0.msg===msg&&d0.win===panes.indexOf(P)+1) d0.n=(d0.n||1)+1;
  else{DIAG.unshift({t:new Date().toISOString(),win:panes.indexOf(P)+1,view:P.S.view,bt:P.S.bt,msg,n:1,stack:String(err&&err.stack||'').split('\n').slice(0,6).join('\n')}); if(DIAG.length>50) DIAG.pop()}
  if(P.errN<=3){console.error(err); P.V.scroll=0; P.dirty=true} else{P.errStop=true; P.dirty=false}
  renderErr(P,msg);
}
function renderErr(P,msg){
  let b=P.el.querySelector('.rerr');
  if(!b){b=el_('div','rerr'); b.innerHTML='<span></span><button type="button" class="btn2 sm" data-a="reset">Reset this window</button><button type="button" class="btn2 sm" data-a="log">Details</button>'; P.el.querySelector('.body').appendChild(b);
    b.addEventListener('pointerdown',e=>e.stopPropagation());
    b.addEventListener('click',e=>{const a=e.target.closest('[data-a]'); if(!a) return; if(a.dataset.a==='log') openDiagnostics(); else{P.S.ind=freshInd({}); P.S.studies=[]; P.stc=null; resetView(P); P.errN=0; P.errStop=false; P.dirty=true; saveLayout(); b.hidden=true}})}
  b.hidden=!P.errN; if(P.errN) b.querySelector('span').textContent=`This window could not be drawn${P.errStop?' (stopped retrying)':''}: ${msg}`;
}
function openDiagnostics(){
  openDialog('Diagnostics',body=>{
    body.appendChild(el_('p','idesc',DIAG.length?'Rendering errors since the page opened, newest first. Copy them into a bug report.':'No rendering errors since the page opened.'));
    const ta=el_('textarea','code'); ta.readOnly=true; ta.value=DIAG.map(d=>`${d.t} · window ${d.win} (${d.view}, ${d.bt})${d.n>1?` · ×${d.n}`:''}\n${d.msg}\n${d.stack}`).join('\n\n')||'—'; body.appendChild(ta);
    const act=el_('div','dact'), c=el_('button','btn2','Copy'); c.type='button'; c.addEventListener('click',()=>{try{navigator.clipboard.writeText(ta.value)}catch(e){} ta.select()}); act.appendChild(c); body.appendChild(act);
  });
}

const SNAP_MAX=40;
const snapNow=()=>{const o={}; for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i); if(k&&k.startsWith('potik.')) o[k]=localStorage.getItem(k)} return o};
const strHash=s=>{let h=2166136261; for(let i=0;i<s.length;i++){h^=s.charCodeAt(i); h=Math.imul(h,16777619)} return (h>>>0).toString(36)+'.'+s.length};
let snapLast='';
async function snapPut(keys,reason,force){
  const js=JSON.stringify(keys), h=strHash(js); if(h===snapLast&&!force) return false; snapLast=h;
  await idbDo('snaps','readwrite',s=>s.put({id:Date.now(),reason,ver:APP_VER,n:Object.keys(keys).length,size:js.length,keys}));
  const ids=(await idbDo('snaps','readonly',s=>s.getAllKeys())).sort((a,b)=>a-b);
  if(ids.length>SNAP_MAX) await idbDo('snaps','readwrite',s=>{let r; for(const id of ids.slice(0,ids.length-SNAP_MAX)) r=s.delete(id); return r});
  return true;
}
async function snapStart(){
  try{const prev=BOOT_KEYS['potik.ver']; if(Object.keys(BOOT_KEYS).length>1) await snapPut(BOOT_KEYS,prev&&prev!==APP_VER?`before version ${APP_VER}`:'page opened',true); localStorage.setItem('potik.ver',APP_VER)}
  catch(e){console.warn('backup',e)}
  setInterval(()=>{snapPut(snapNow(),'every 5 minutes').catch(()=>{})},300000);
  window.addEventListener('pagehide',()=>{try{saveLayout(); save()}catch(e){}});
}
function snapRestore(x){
  snapPut(snapNow(),'before restoring a backup',true).catch(()=>{}).finally(()=>{
    const old=[]; for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i); if(k&&k.startsWith('potik.')) old.push(k)} old.forEach(k=>localStorage.removeItem(k));
    for(const [k,v] of Object.entries(x.keys)) if(k.startsWith('potik.')&&typeof v==='string') try{localStorage.setItem(k,v)}catch(e){}
    try{localStorage.setItem('potik.ver',APP_VER)}catch(e){} toast('Backup restored · reloading','info'); setTimeout(()=>location.reload(),600)});
}

        dl.addEventListener('click',()=>{const blob=new Blob([JSON.stringify({app:'potik',version:1,saved:new Date(x.id).toISOString(),keys:x.keys},null,1)],{type:'application/json'}); saveFile(blob,`potik-backup-${new Date(x.id).toISOString().slice(0,16).replace(/[:T]/g,'-')}.json`)});
        cell.append(rs,' ',dl); t.appendChild(tr)}

// which DOM column / row a point is on
function domHit(P,p){
  const g=P.V.dg; if(!g) return null; const x=p.x-g.x0; if(x<0||x>g.W) return null;
  const c=g.cols.find(c=>x>=c.x&&x<c.x+c.w); if(!c) return null;
  if(p.y<g.hd) return {hdr:true,col:c.id};
  const r=Math.floor((p.y-g.top)/g.rh); if(r<0||r>=g.nR) return null;
  return {hdr:false,col:c.id,px:P.V.domC+g.mid-r,x:g.x0+c.x,y:g.top+r*g.rh,w:c.w,h:g.rh};
}
function domClick(P,p){
  const h=domHit(P,p); if(!h) return;
  if(h.hdr){if(h.col==='price') domRecentre(P); else if(h.col==='abid'||h.col==='aask'){AT.clear(); allDirty()} return}
  if(h.col==='notes') setTimeout(()=>editNote(P,h),30);   // after the click, so focus stays in the field
  else if(h.col==='orders'){const os=BRK.orders.filter(o=>o.px===h.px); os.forEach(o=>cancelOrder(o.id,true)); if(os.length){brkChanged(); toast(`Cancelled ${os.length} order${os.length>1?'s':''} at ${fP(h.px)}`,'info')}}
  else if(ACC.clickTrade&&!ACC.dblClick&&(h.col==='bid'||h.col==='ask')) priceOrder(h.col==='bid'?1:-1,h.px);
}
function editNote(P,h){
  const host=P.el.querySelector('.body'); host.querySelectorAll('.nedit').forEach(n=>n.remove());
  const inp=el_('input','nedit'); inp.type='text'; inp.maxLength=60; inp.value=NOTES[h.px]||''; inp.placeholder='Note at '+fP(h.px);
  Object.assign(inp.style,{left:h.x+'px',top:h.y+'px',width:Math.max(140,h.w)+'px',height:Math.max(18,h.h)+'px'});
  host.appendChild(inp); inp.focus(); inp.select();
  let done=false;
  const fin=keep=>{if(done) return; done=true; if(keep){const v=inp.value.trim(); if(v) NOTES[h.px]=v; else delete NOTES[h.px]; saveNotes()} inp.remove(); allDirty()};
  inp.addEventListener('keydown',e=>{e.stopPropagation(); if(e.key==='Enter') fin(true); else if(e.key==='Escape') fin(false)});
  inp.addEventListener('blur',()=>fin(true));
}

  linkTick();
  if(DWIN&&ts-lastDw>100){lastDw=ts; updateDataWin()}
  if(ts-lastClk>200){clk.textContent=(RP.on&&!RP.blind?realDate(sim.t)+' ':'')+clock(sim.t,true)+' '+TZL; lastClk=ts; if(RP.on) syncReplayBar()}
}
READY=true; $('#busy').hidden=true; snapStart();
requestAnimationFrame(frame);
})();

</script>
